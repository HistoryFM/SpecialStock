name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-auth-secret-that-is-not-used-outside-tests
      APP_PASSWORD_HASH: $2b$12$ppchrf0OOjsY/00PHKcW7O8APtYhtDMoKTdmMOO7uo2KEpL2YM5c6
      LOCAL_DATABASE_PATH: .data/ci-specialstock
      SPECIALSTOCK_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
